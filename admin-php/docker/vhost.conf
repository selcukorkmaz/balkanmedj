<VirtualHost *:80>
    # Repo root is the document root: the static public site is served at "/".
    DocumentRoot /var/www/html

    # Admin panel lives under /yonetim (mirrors the cPanel subdirectory layout).
    Alias /yonetim /var/www/html/admin-php/public

    <Directory /var/www/html/admin-php/public>
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html>
        AllowOverride All
        Require all granted

        # Admin UI references the public site under /site/* for previews.
        RewriteEngine On
        RewriteRule ^site/(.*)$ /$1 [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
