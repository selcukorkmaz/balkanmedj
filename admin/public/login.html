<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balkan Med J — Giriş</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-teal-700 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <span class="text-white font-bold text-2xl">B</span>
      </div>
      <h1 class="text-xl font-bold text-gray-900">Balkan Medical Journal</h1>
      <p class="text-sm text-gray-500 mt-1">Admin Panel</p>
    </div>

    <form id="login-form" class="bg-white rounded-xl border p-6 shadow-sm">
      <div id="error-msg" class="hidden bg-red-50 text-red-700 text-sm px-4 py-3 rounded-lg mb-4"></div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Kullanıcı Adı</label>
        <input id="username" type="text" autocomplete="username" required
          class="w-full px-4 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none">
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Şifre</label>
        <input id="password" type="password" autocomplete="current-password" required
          class="w-full px-4 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none">
      </div>

      <button type="submit" id="login-btn"
        class="w-full py-2.5 bg-teal-700 text-white rounded-lg hover:bg-teal-800 font-medium text-sm transition-colors">
        Giriş Yap
      </button>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('error-msg');
      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor...';
      errEl.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          errEl.textContent = data.error || 'Giriş başarısız';
          errEl.classList.remove('hidden');
        }
      } catch {
        errEl.textContent = 'Bağlantı hatası';
        errEl.classList.remove('hidden');
      }
      btn.disabled = false;
      btn.textContent = 'Giriş Yap';
    });

    // Auto-focus username
    document.getElementById('username').focus();
  </script>
</body>
</html>
