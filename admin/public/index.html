<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balkan Med J — Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens (premium muted palette — easy on the eyes) ── */
    :root {
      /* Brand — single muted teal, less hue jump on hover */
      --brand: #2c8480;            /* muted teal */
      --brand-strong: #1f6f6c;     /* slightly darker for CTAs */
      --brand-hover: #155956;
      --brand-soft: #f0f7f6;       /* very soft tint */
      --brand-soft-2: #d8e9e7;
      --brand-ring: rgba(44,132,128,.18);
      /* Semantic — desaturated by ~20-25%, lighter text variant */
      --success: #4f8a5a;          /* sage green */
      --success-soft: #f1f6f2;
      --success-soft-2: #dde9df;
      --success-text: #2f5d3a;
      --info: #5b7794;             /* dusty slate-blue */
      --info-soft: #f1f4f7;
      --info-soft-2: #dde4ed;
      --info-text: #344c66;
      --warning: #b07a3e;          /* muted amber */
      --warning-soft: #faf5ed;
      --warning-soft-2: #ecddc1;
      --warning-text: #76502a;
      --danger: #b85a5a;            /* muted brick */
      --danger-hover: #984a4a;
      --danger-soft: #faf1f1;
      --danger-soft-2: #ecd6d6;
      --danger-text: #7a3838;
      /* Neutral palette — premium warm off-white, softer text */
      --bg-page: #f7f6f3;
      --bg-page-2: #fafaf8;
      --bg-card: #ffffff;
      --bg-subtle: #f1efea;
      --bg-elevated: #ffffff;
      --text-strong: #27262a;      /* softened from zinc-900 to deep zinc-800 */
      --text: #3a3a3e;             /* warm zinc-700 */
      --text-muted: #76757b;
      --text-faint: #a8a7ac;
      --border: #e8e6e0;
      --border-soft: #efede7;
      --border-strong: #d8d5cf;
      /* Premium shadows — soft, multi-layer */
      --shadow-sm: 0 1px 2px 0 rgba(24,24,27,.04);
      --shadow-card: 0 1px 2px 0 rgba(24,24,27,.04), 0 2px 6px -2px rgba(24,24,27,.06);
      --shadow-md:   0 2px 4px -1px rgba(24,24,27,.06), 0 8px 16px -4px rgba(24,24,27,.08);
      --shadow-lg:   0 10px 30px -10px rgba(24,24,27,.18), 0 4px 12px -4px rgba(24,24,27,.08);
      --shadow-inset: inset 0 0 0 1px rgba(24,24,27,.04);
      /* Radius */
      --radius-sm: 6px;
      --radius:   10px;
      --radius-lg: 14px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-page);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.005em;
      font-size: 13.5px;
      line-height: 1.5;
    }
    /* Default link styling — wrapped in :where() so it has 0 specificity
       and any Tailwind utility (text-white, text-red-600, etc.) wins. */
    :where(a) { color: var(--brand-strong); }
    :where(a):hover { color: var(--brand-hover); }
    /* Make small grey text more readable */
    .text-gray-400 { color: var(--text-faint) !important; }
    .text-gray-500 { color: var(--text-muted) !important; }
    .text-gray-600 { color: var(--text-muted) !important; }
    .text-gray-700 { color: var(--text) !important; }
    .text-gray-900 { color: var(--text-strong) !important; }

    /* ── Typography scale (Stripe-style) ── */
    .text-display { font-size: 28px; line-height: 1.18; font-weight: 700; letter-spacing: -0.025em; color: var(--text-strong); }
    h1, .h1 { font-size: 22px; line-height: 1.22; font-weight: 600; letter-spacing: -0.02em; color: var(--text-strong); }
    h2, .h2 { font-size: 16px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; color: var(--text-strong); }
    h3, .h3 { font-size: 14px; line-height: 1.35; font-weight: 600; letter-spacing: -0.005em; color: var(--text-strong); }
    .text-body { font-size: 13.5px; line-height: 1.55; color: var(--text); }
    .text-caption { font-size: 12px; line-height: 1.45; color: var(--text-muted); }
    .text-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--brand); }
    .text-mono { font-family: 'ui-monospace', SFMono-Regular, Menlo, Monaco, 'Cascadia Mono', monospace; font-size: 12px; }
    /* Numeric values */
    .tabular { font-variant-numeric: tabular-nums; }

    /* ── Sidebar (premium + collapsible) ── */
    .app-sidebar {
      background: linear-gradient(180deg, #ffffff 0%, var(--bg-page-2) 100%);
      border-right: 1px solid var(--border-soft);
      transition: width .18s ease;
    }
    /* When body has .sidebar-collapsed, shrink to icon-only rail */
    body.sidebar-collapsed .app-sidebar { width: 68px !important; }
    body.sidebar-collapsed .app-sidebar .sidebar-section-title,
    body.sidebar-collapsed .app-sidebar .sidebar-link-label,
    body.sidebar-collapsed .app-sidebar > div:first-child .min-w-0,
    body.sidebar-collapsed .app-sidebar > div:first-child button:not(.sidebar-toggle) > span {
      display: none !important;
    }
    body.sidebar-collapsed .app-sidebar > div:first-child > button:not(.sidebar-toggle) {
      /* Hide the "Hızlı ara" trigger in collapsed mode */
      display: none !important;
    }
    body.sidebar-collapsed .app-sidebar .sidebar-link {
      justify-content: center;
      padding-left: 0; padding-right: 0;
    }
    body.sidebar-collapsed .app-sidebar > div:first-child {
      padding-left: 12px; padding-right: 12px;
    }
    body.sidebar-collapsed .app-sidebar > div:first-child > div:first-child {
      justify-content: center;
      margin-bottom: 0;
    }
    /* Shift main content when sidebar is collapsed */
    body.sidebar-collapsed main#main-content { margin-left: 68px !important; }
    /* Tooltip on hover when collapsed */
    body.sidebar-collapsed .app-sidebar .sidebar-link {
      position: relative;
    }
    body.sidebar-collapsed .app-sidebar .sidebar-link:hover::after {
      content: attr(data-label);
      position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
      margin-left: 8px;
      background: var(--text-strong); color: #fff;
      padding: 4px 8px; border-radius: 6px;
      font-size: 12px; font-weight: 500; white-space: nowrap;
      pointer-events: none; z-index: 40;
      box-shadow: var(--shadow-md);
    }
    /* Toggle button styling */
    .sidebar-toggle {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      color: var(--text-muted);
      background: transparent; border: 0; cursor: pointer;
      transition: background-color .12s ease, color .12s ease;
    }
    .sidebar-toggle:hover { background: var(--bg-subtle); color: var(--text-strong); }
    body.sidebar-collapsed .sidebar-toggle svg { transform: rotate(180deg); }
    .sidebar-link {
      transition: background-color .15s ease, color .15s ease;
      color: var(--text);
      position: relative;
    }
    .sidebar-link:hover { background-color: var(--bg-subtle); color: var(--text-strong); }
    .sidebar-link.is-active {
      background: var(--brand-soft);
      color: var(--brand-strong);
      font-weight: 600;
    }
    .sidebar-link.is-active::before {
      content: '';
      position: absolute;
      left: -12px;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: var(--brand);
      border-radius: 0 3px 3px 0;
    }
    .sidebar-link.is-active svg { color: var(--brand-strong); }
    .sidebar-section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      padding: 8px 18px 2px;
    }

    /* ── Buttons (premium) ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .08s ease;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      letter-spacing: -0.005em;
    }
    .btn:active { transform: translateY(0.5px); }
    .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .btn-primary {
      background: linear-gradient(180deg, var(--brand) 0%, var(--brand-strong) 100%);
      color: #fff;
      border: 1px solid var(--brand-strong);
      box-shadow: 0 1px 2px rgba(15,118,110,.18), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); box-shadow: 0 2px 6px rgba(15,118,110,.25); }
    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-strong);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover { background: var(--bg-page); border-color: var(--border-strong); }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid transparent;
    }
    .btn-ghost:hover { background: var(--bg-subtle); color: var(--text-strong); }
    .btn-danger {
      background: var(--bg-card);
      color: var(--danger);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .btn-danger:hover { background: var(--danger-soft); border-color: #fecaca; }
    .btn-danger-solid {
      background: var(--danger);
      color: #fff;
      border: 1px solid var(--danger);
      box-shadow: 0 1px 2px rgba(220,38,38,.2), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .btn-danger-solid:hover { background: var(--danger-hover); border-color: var(--danger-hover); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-lg { padding: 10px 18px; font-size: 14px; }
    .btn-icon { padding: 7px; }

    /* ── Cards (premium elevation, less border) ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      transition: box-shadow .2s ease, border-color .2s ease;
    }
    .card-flat { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--radius); }
    .card-hero {
      background:
        radial-gradient(circle at 100% 0%, rgba(20,184,166,0.10) 0%, transparent 50%),
        linear-gradient(180deg, #ffffff 0%, var(--brand-soft) 100%);
      border: 1px solid var(--brand-soft-2);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }
    .card-padded { padding: 22px; }
    .card-elevated { box-shadow: var(--shadow-md); border-color: transparent; }
    .card:hover.card-interactive { box-shadow: var(--shadow-md); border-color: var(--border); }

    /* ── Form inputs (premium) ── */
    .input, input[type="text"].input, input[type="number"].input, input[type="date"].input, input[type="email"].input, input[type="password"].input, select.input, textarea.input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text-strong);
      box-shadow: var(--shadow-sm);
      transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    }
    .input::placeholder, textarea.input::placeholder { color: var(--text-faint); }
    .input:hover, textarea.input:hover, select.input:hover { border-color: var(--border-strong); }
    .input:focus, textarea.input:focus, select.input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-ring);
      background: var(--bg-card);
    }
    .label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-strong); margin-bottom: 6px; letter-spacing: -0.005em; }

    /* ── Page header & layout ── */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-soft);
    }
    .page-title { font-size: 24px; line-height: 1.18; margin: 0; font-weight: 700; letter-spacing: -0.025em; color: var(--text-strong); }
    .page-subtitle { color: var(--text-muted); font-size: 13.5px; line-height: 1.5; margin-top: 6px; max-width: 600px; }
    .page-eyebrow { color: var(--brand); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    /* Section title — used inside cards */
    .section-title { font-size: 15px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.005em; line-height: 1.3; }
    .section-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ── Tables (premium, less border noise) ── */
    .table-wrap { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-card); }
    .table-wrap table { width: 100%; font-size: 13px; }
    .table-wrap thead { background: var(--bg-page); }
    .table-wrap thead tr { border-bottom: 1px solid var(--border-soft); }
    .table-wrap th { text-align: left; padding: 12px 16px; font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
    .table-wrap td { padding: 14px 16px; border-top: 1px solid var(--border-soft); color: var(--text); }
    .table-wrap tbody tr { transition: background-color .12s ease; }
    .table-wrap tbody tr:hover { background: var(--bg-page); }
    .table-wrap tbody tr:first-child td { border-top: 0; }

    /* ── Badges (semantic + categorical) ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
      background: var(--bg-subtle); color: var(--text);
      border: 1px solid transparent;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; display: inline-block; }
    .badge-brand   { background: var(--brand-soft);   color: var(--brand-strong); border-color: var(--brand-soft-2); }
    .badge-success { background: var(--success-soft); color: var(--success-text); border-color: var(--success-soft-2); }
    .badge-info    { background: var(--info-soft);    color: var(--info-text);    border-color: var(--info-soft-2); }
    .badge-warning { background: var(--warning-soft); color: var(--warning-text); border-color: var(--warning-soft-2); }
    .badge-danger  { background: var(--danger-soft);  color: var(--danger-text);  border-color: var(--danger-soft-2); }
    .badge-neutral { background: var(--bg-subtle); color: var(--text-muted); }
    /* Legacy categorical aliases — all collapse to neutral now to avoid visual noise */
    .badge-violet, .badge-rose, .badge-sky, .badge-fuchsia { background: var(--bg-subtle); color: var(--text-muted); border-color: var(--border-soft); }

    /* ── Banners (subtle alerts with left accent) ── */
    .banner {
      display: flex; gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid;
      font-size: 13px;
      align-items: flex-start;
    }
    .banner svg { flex-shrink: 0; margin-top: 1px; }
    .banner-title { font-weight: 600; line-height: 1.35; }
    .banner-body  { line-height: 1.5; opacity: 0.92; margin-top: 2px; font-size: 12px; }
    .banner-brand   { background: var(--brand-soft);   border-color: var(--brand-soft-2);   color: var(--brand-strong); }
    .banner-info    { background: var(--info-soft);    border-color: var(--info-soft-2);    color: var(--info-text); }
    .banner-success { background: var(--success-soft); border-color: var(--success-soft-2); color: var(--success-text); }
    .banner-warning { background: var(--warning-soft); border-color: var(--warning-soft-2); color: var(--warning-text); }
    .banner-danger  { background: var(--danger-soft);  border-color: var(--danger-soft-2);  color: var(--danger-text); }

    /* ── Toast (overrides JS-injected inline styles via class hooks) ── */
    .toast {
      position: fixed; right: 16px; z-index: 50;
      display: inline-flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500; color: #fff;
      box-shadow: var(--shadow-lg);
      transform: translateY(-8px); opacity: 0;
      transition: transform .2s ease, opacity .2s ease;
    }
    .toast.is-visible { transform: translateY(0); opacity: 1; }
    .toast-success { background: var(--brand); }
    .toast-error   { background: var(--danger); }
    .toast-warning { background: #d97706; }
    .toast svg { flex-shrink: 0; }

    /* ── Modal overlay & dialog (premium) ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(24,24,27,.4);
      backdrop-filter: blur(6px) saturate(140%);
      -webkit-backdrop-filter: blur(6px) saturate(140%);
      z-index: 40;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      animation: fadeIn .15s ease;
    }
    .modal-dialog {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 60px -15px rgba(0,0,0,.25), 0 8px 24px -8px rgba(0,0,0,.12);
      max-width: 640px; width: 100%;
      max-height: 80vh;
      display: flex; flex-direction: column;
      animation: scaleIn .18s cubic-bezier(.16,1,.3,1);
      border: 1px solid var(--border-soft);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

    /* ── Command Palette (Ctrl+K) ── */
    .cmd-overlay {
      position: fixed; inset: 0;
      background: rgba(24,24,27,.42);
      backdrop-filter: blur(8px) saturate(160%);
      -webkit-backdrop-filter: blur(8px) saturate(160%);
      z-index: 60;
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 12vh;
      animation: fadeIn .12s ease;
    }
    .cmd-dialog {
      width: 100%; max-width: 640px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 60px -15px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.15);
      border: 1px solid var(--border-soft);
      overflow: hidden;
      animation: scaleIn .15s cubic-bezier(.16,1,.3,1);
      max-height: 70vh;
      display: flex; flex-direction: column;
    }
    .cmd-search {
      width: 100%;
      padding: 14px 16px 14px 44px;
      font-size: 15px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text-strong);
      border-bottom: 1px solid var(--border-soft);
    }
    .cmd-search::placeholder { color: var(--text-faint); }
    .cmd-search-icon {
      position: absolute; left: 14px; top: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .cmd-results { overflow-y: auto; padding: 6px; }
    .cmd-section-title {
      font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-faint);
      padding: 10px 12px 4px;
    }
    .cmd-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      transition: background-color .1s ease;
    }
    .cmd-item:hover, .cmd-item.is-active {
      background: var(--brand-soft);
      color: var(--brand-strong);
    }
    .cmd-item.is-active { color: var(--brand-strong); }
    .cmd-item-icon {
      flex-shrink: 0;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-subtle); border-radius: 6px;
      color: var(--text-muted);
    }
    .cmd-item.is-active .cmd-item-icon { background: var(--brand-soft-2); color: var(--brand-strong); }
    .cmd-item-text { flex: 1; min-width: 0; }
    .cmd-item-title { font-weight: 500; font-size: 13.5px; line-height: 1.2; }
    .cmd-item-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmd-item.is-active .cmd-item-sub { color: var(--brand); }
    .cmd-kbd {
      flex-shrink: 0;
      font-size: 11px; font-weight: 600;
      padding: 2px 6px; border-radius: 4px;
      background: var(--bg-subtle); color: var(--text-muted);
      border: 1px solid var(--border-soft);
    }
    .cmd-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 14px;
      border-top: 1px solid var(--border-soft);
      background: var(--bg-page);
      font-size: 11.5px; color: var(--text-muted);
    }
    .cmd-empty { padding: 24px 16px; text-align: center; color: var(--text-faint); font-size: 13px; }

    /* ── Loading skeleton ── */
    .skeleton { background: linear-gradient(90deg, #e2e8f0 0%, #f1f5f9 50%, #e2e8f0 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; border-radius: 6px; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* WYSIWYG editor styling */
    [contenteditable] h2 { font-size: 1.25rem; font-weight: 600; margin: 0.75em 0 0.25em; }
    [contenteditable] h3 { font-size: 1.15rem; font-weight: 700; margin: 0.85em 0 0.3em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.15em; }
    [contenteditable] h4 { font-size: 1.05rem; font-weight: 600; margin: 0.75em 0 0.25em; }
    [contenteditable] h5 { font-size: 0.98rem; font-weight: 600; margin: 0.7em 0 0.2em; color: #374151; }
    [contenteditable] h6 { font-size: 0.92rem; font-weight: 600; font-style: italic; margin: 0.6em 0 0.2em; color: #4b5563; }
    [contenteditable] p  { margin: 0.5em 0; }
    /* Active formatting state in the editor toolbar (reflects the selection). */
    [id$="-toolbar"] button.is-active { background: var(--brand-soft, #ccfbf1); color: var(--brand, #0d9488); box-shadow: inset 0 0 0 1px var(--brand, #0d9488); }
    [contenteditable] ul { list-style: disc; padding-left: 1.5em; margin: 0.5em 0; }
    [contenteditable] ol { list-style: decimal; padding-left: 1.5em; margin: 0.5em 0; }
    [contenteditable] a  { color: var(--brand); text-decoration: underline; }
    [contenteditable] strong, [contenteditable] b { font-weight: 600; }
    [contenteditable] em, [contenteditable] i { font-style: italic; }
    /* Figures inserted via "Metne Ekle" */
    [contenteditable] figure.article-figure,
    [contenteditable] img {
      display: block;
      max-width: 100%;
      margin: 1em auto;
      border-radius: 6px;
    }
    [contenteditable] figure.article-figure img { margin: 0 auto; }
    [contenteditable] figure.article-figure figcaption {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      font-style: italic;
    }
    /* Figure/table size variants — mirror the live-site sizing so the editor
       preview matches what the reader will see after publishing. */
    [contenteditable] .article-figure[data-size="small"],
    [contenteditable] .article-table-wrap[data-size="small"] {
      max-width: 45%;
      margin-left: auto;
      margin-right: auto;
    }
    [contenteditable] .article-figure[data-size="medium"],
    [contenteditable] .article-table-wrap[data-size="medium"] {
      max-width: 72%;
      margin-left: auto;
      margin-right: auto;
    }
    [contenteditable] .article-figure[data-size="large"],
    [contenteditable] .article-table-wrap[data-size="large"] {
      max-width: 100%;
    }
    [contenteditable] .article-figure[data-size="full"],
    [contenteditable] .article-table-wrap[data-size="full"] {
      max-width: 100%;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
    }
    /* Captions inside figures/tables: only the FIG./TABLE label is bold,
       and the body text uses normal weight + non-italic (overrides the
       generic figcaption italic rule above for caption paragraphs). */
    [contenteditable] .article-figure > p,
    [contenteditable] .article-figure > figcaption,
    [contenteditable] .article-table-wrap > p {
      font-weight: 400;
      font-style: normal;
      text-align: left;
    }
    [contenteditable] .article-figure > p strong,
    [contenteditable] .article-figure > figcaption strong,
    [contenteditable] .article-table-wrap > p.table-label strong {
      font-weight: 700;
    }
    /* Tables — imported from JATS XML, uploaded, or pasted. Without these rules
       an imported <table> renders borderless and looks like jumbled text. */
    [contenteditable] .article-table-wrap { margin: 1em 0; overflow-x: auto; }
    /* Table caption: styled IDENTICALLY to the article's figure captions, which
       render as a <p><strong>FIG. N.</strong> …</p> at BODY size/colour/font
       (only the prefix bold; see the font-weight rules above). So the table
       label inherits the body text size/colour/family too — NOT a small grey
       figcaption. The prefix must read as plain text, never a teal/underlined link. */
    [contenteditable] .table-label { font-size: inherit; color: inherit; font-family: inherit; margin: 0 0 0.35em; text-align: left; }
    [contenteditable] .table-label a,
    [contenteditable] figure.article-figure > figcaption a[href^="#figure-"],
    [contenteditable] figure.article-figure > figcaption a[href^="#fig-"] {
      color: inherit; text-decoration: none; border-bottom: 0; cursor: text; pointer-events: none;
    }
    [contenteditable] table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      font-size: 0.85rem;
    }
    [contenteditable] th, [contenteditable] td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
    }
    [contenteditable] thead th { background: var(--bg-page); font-weight: 600; }
    [contenteditable] .table-footnote { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.35em; }

    /* Menü & Footer form editor — clean hairline rows instead of nested boxes */
    .nf-item { border-bottom: 1px solid var(--border-soft); }
    .nf-item:last-child { border-bottom: 0; }
    .nf-type { display:inline-flex; width:28px; height:28px; flex-shrink:0; align-items:center; justify-content:center; border-radius:7px; background:var(--bg-page); color:var(--text-faint); }
    .nf-type svg { width:15px; height:15px; }
    .nf-iconbtn { display:inline-flex; width:28px; height:28px; flex-shrink:0; align-items:center; justify-content:center; border-radius:7px; color:var(--text-faint); transition:background .1s, color .1s; }
    .nf-iconbtn:hover:not(:disabled) { background:var(--bg-page); color:var(--text-strong); }
    .nf-iconbtn:disabled { opacity:.25; cursor:default; }
    .nf-iconbtn svg { width:15px; height:15px; }
    .nf-iconbtn.nf-del:hover:not(:disabled) { background:#fee2e2; color:var(--danger); }
    .nf-children { margin-left:36px; border-left:2px solid var(--border-soft); padding-left:14px; }
    .nf-addlink { font-size:12px; font-weight:500; color:var(--brand); padding:6px 2px 2px; display:inline-block; }
    .nf-addlink:hover { text-decoration:underline; }

    /* Editorial Board — per-section tab rail (one section visible at a time) */
    .ed-tab-btn { padding:7px 14px; font-size:13px; font-weight:500; color:var(--text-muted); border-radius:7px 7px 0 0; border-bottom:2px solid transparent; transition:color .12s, background .12s, border-color .12s; white-space:nowrap; }
    .ed-tab-btn:hover { color:var(--text-strong); background:var(--bg-page); }
    .ed-tab-active { color:var(--brand); border-bottom-color:var(--brand); background:var(--bg-page); }
    .ed-tab-count { display:inline-block; font-size:11px; color:var(--text-faint); margin-left:4px; font-weight:400; }
    .ed-tab-active .ed-tab-count { color:var(--brand); opacity:.75; }

    /* Editorial Board member rows — each member as a distinct card so long
       lists (e.g. Associate Editors, 36 members) don't visually blur. */
    .ed-mrow {
      position: relative;
      background: #fff;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 14px 14px 14px 36px;
      margin-bottom: 10px;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .ed-mrow:nth-child(even) { background: #faf9f6; }
    .ed-mrow:hover { border-color: #cbd5e1; box-shadow: 0 1px 4px rgba(15,23,42,.05); background: #fff; }
    .ed-mrow:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: #fff; }
    .ed-mrow-num {
      position: absolute;
      top: 12px; left: 10px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-faint);
      letter-spacing: 0.04em;
      user-select: none;
    }
    /* Drag-and-drop reorder handle (used by author rows, AIP author rows). */
    .row-grip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      min-height: 32px;
      cursor: grab;
      color: var(--text-faint);
      user-select: none;
      flex-shrink: 0;
      border-radius: 4px;
      transition: color .12s ease, background .12s ease;
    }
    .row-grip:hover { color: var(--text-strong); background: rgba(15, 23, 42, .06); }
    .row-grip:active { cursor: grabbing; }
    .row-grip svg { fill: currentColor; }
    .row-dragging { opacity: .45; }
    .author-row, .aipf-author-row, .ed-mrow {
      transition: border-color .1s ease, box-shadow .1s ease;
    }
    /* The Editorial Board grip is stacked above a tight avatar column;
       trim its min-height so the column doesn't grow taller. */
    .ed-mrow-grip { min-height: 18px; width: 28px; }
    .drop-above, .drop-below { position: relative; }
    .drop-above::before, .drop-below::after {
      content: ''; position: absolute; left: 0; right: 0;
      height: 3px; background: var(--brand); border-radius: 2px; pointer-events: none;
    }
    .drop-above::before { top: -4px; }
    .drop-below::after  { bottom: -4px; }

    /* Cross-reference floating bubble — appears above text selection inside
       the full-text visual editor (article + AIP). Galenos-style inline picker. */
    .cr-bubble {
      position: absolute;
      z-index: 9999;
      background: var(--bg-card, #fff);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 520px;
      min-width: 320px;
      font-size: 12px;
      pointer-events: auto;
    }
    .cr-bubble.hidden { display: none; }
    .cr-bubble::before {
      content: ''; position: absolute; left: 24px; bottom: -6px;
      width: 12px; height: 12px;
      background: var(--bg-card, #fff);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transform: rotate(45deg);
    }
    .cr-bubble[data-flip="below"]::before {
      bottom: auto; top: -6px;
      border-right: 0; border-bottom: 0;
      border-left: 1px solid var(--border);
      border-top: 1px solid var(--border);
    }
    .cr-bubble-row {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .cr-bubble-label {
      font-size: 10px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      min-width: 44px;
    }
    .cr-bubble-chip {
      padding: 3px 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-strong);
      background: var(--bg-page);
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
    }
    .cr-bubble-chip:hover {
      background: var(--brand-soft);
      color: var(--brand);
      border-color: var(--brand);
    }
    .cr-bubble-manual {
      display: flex; align-items: center; gap: 4px;
    }
    .cr-bubble-manual input {
      width: 48px;
      padding: 3px 6px;
      font-size: 11.5px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg-page);
    }
    .cr-bubble-manual button {
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-strong);
      background: var(--bg-page);
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      cursor: pointer;
    }
    .cr-bubble-manual button:hover { background: var(--brand-soft); color: var(--brand); }
    .cr-bubble-empty {
      font-size: 10.5px;
      color: var(--text-faint);
      font-style: italic;
    }
    .cr-bubble-close {
      position: absolute; top: 4px; right: 4px;
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
      color: var(--text-faint);
      cursor: pointer;
      background: transparent; border: 0;
      font-size: 14px; line-height: 1;
    }
    .cr-bubble-close:hover { background: var(--bg-page); color: var(--text-strong); }

    /* Sectioned layout: each kind is its own block with label + manual input
       in a header row, and the tiles/chips beneath it. */
    .cr-bubble {
      max-width: 640px;
      min-width: 420px;
    }
    .cr-bubble-section { display: flex; flex-direction: column; gap: 6px; }
    .cr-bubble-section + .cr-bubble-section {
      border-top: 1px solid var(--border-soft);
      padding-top: 6px;
    }
    .cr-bubble-section-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .cr-bubble-section-body {
      display: flex; flex-wrap: wrap; gap: 6px;
      max-height: 220px; overflow-y: auto;
    }

    /* Figure tile: thumbnail + #N badge + truncated caption. */
    .cr-fig-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 96px);
      gap: 6px;
      width: 100%;
    }
    .cr-fig-tile {
      display: flex; flex-direction: column;
      width: 96px;
      background: var(--bg-page);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      padding: 0;
      text-align: left;
      transition: border-color .12s, box-shadow .12s, transform .08s;
    }
    .cr-fig-tile:hover {
      border-color: var(--brand);
      box-shadow: 0 2px 6px rgba(15, 23, 42, .12);
      transform: translateY(-1px);
    }
    .cr-fig-thumb {
      position: relative;
      width: 96px; height: 64px;
      background: #f1f1ee;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .cr-fig-thumb img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .cr-fig-placeholder {
      color: var(--text-faint); font-size: 10px;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .cr-fig-num {
      position: absolute; top: 3px; left: 4px;
      background: rgba(15, 23, 42, .8); color: #fff;
      font-size: 10px; font-weight: 700;
      padding: 1px 5px; border-radius: 3px;
    }
    /* Pending = on disk (Dosyalar) but not yet placed in body. */
    .cr-pending-badge {
      display: inline-block;
      background: #f59e0b; color: #fff;
      font-size: 9px; font-weight: 700;
      padding: 1px 5px; border-radius: 3px;
      letter-spacing: 0.02em;
      margin-left: 4px;
    }
    .cr-fig-tile.cr-tile-pending .cr-pending-badge {
      position: absolute; top: 3px; right: 4px;
      margin-left: 0;
    }
    .cr-tile-pending {
      border-style: dashed !important;
      border-color: #f59e0b !important;
    }
    .cr-fig-caption {
      padding: 4px 6px;
      font-size: 10.5px;
      color: var(--text-strong);
      line-height: 1.3;
      min-height: 28px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Table tile: icon + #N + truncated label. */
    .cr-tab-list {
      display: flex; flex-direction: column; gap: 4px;
      width: 100%;
    }
    .cr-tab-row { display: flex; align-items: stretch; gap: 4px; width: 100%; }
    .cr-tab-row .cr-tab-tile { flex: 1; min-width: 0; }
    .cr-tab-tile {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px;
      background: var(--bg-page);
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      cursor: pointer;
      text-align: left;
      transition: border-color .12s, background .12s;
    }
    .cr-tab-tile:hover { border-color: var(--brand); background: var(--brand-soft); }
    /* Trash button for deleting an in-body table from the bubble. */
    .cr-tab-delete {
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; width: 30px;
      background: var(--bg-page);
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color .12s, background .12s, color .12s;
    }
    .cr-tab-delete:hover { border-color: #dc2626; background: #fef2f2; color: #dc2626; }
    /* Edit (pencil) button for re-editing an in-body table from the bubble. */
    .cr-tab-edit {
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; width: 30px;
      background: var(--bg-page);
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color .12s, background .12s, color .12s;
    }
    .cr-tab-edit:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
    /* Floating toolbar over a hovered figure/table block in the editor:
       move up / move down / edit / delete. */
    .media-block-ctl {
      position: absolute; z-index: 60;
      display: flex; gap: 2px;
      padding: 3px;
      background: #fff;
      border: 1px solid var(--border-soft);
      border-radius: 7px;
      box-shadow: 0 4px 14px rgba(0,0,0,.14);
    }
    .media-block-ctl.hidden { display: none; }
    .media-block-ctl button {
      display: flex; align-items: center; justify-content: center;
      width: 26px; height: 26px;
      border: 1px solid transparent; border-radius: 5px;
      background: transparent; color: var(--text-muted);
      font-size: 13px; line-height: 1; cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
    }
    .media-block-ctl button:hover { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
    .media-block-ctl button[data-mbc="delete"]:hover { background: #fef2f2; color: #dc2626; border-color: #dc2626; }
    .media-block-ctl .mbc-size { height: 26px; font-size: 11.5px; border: 1px solid var(--border-soft); border-radius: 5px; background: #fff; color: var(--text-strong); cursor: pointer; padding: 0 4px; }
    .media-block-ctl .mbc-size:hover { border-color: var(--brand); }
    .media-block-ctl .mbc-divider { width: 1px; align-self: stretch; background: var(--border-soft); margin: 2px 1px; }
    /* Live heading outline / TOC panel for the full-text editor. */
    .heading-outline {
      position: fixed; top: 92px; right: 16px; z-index: 70;
      width: 300px; max-height: 72vh; display: flex; flex-direction: column;
      background: #fff; border: 1px solid var(--border-soft); border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,.16); font-size: 12.5px;
    }
    .heading-outline.hidden { display: none; }
    .heading-outline .ho-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border-soft); }
    .heading-outline .ho-title { font-weight: 600; color: var(--text-strong); }
    .heading-outline .ho-close { border: 0; background: transparent; font-size: 18px; line-height: 1; cursor: pointer; color: var(--text-muted); }
    .heading-outline .ho-summary { padding: 7px 12px; font-size: 11.5px; color: var(--text-muted); border-bottom: 1px solid var(--border-soft); background: var(--bg-subtle); }
    .heading-outline .ho-list { overflow: auto; padding: 4px; }
    .heading-outline .ho-row { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
    .heading-outline .ho-go { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; text-align: left; border: 0; background: transparent; cursor: pointer; padding: 5px 6px; border-radius: 6px; }
    .heading-outline .ho-go:hover { background: var(--brand-soft); }
    .heading-outline .ho-badge { flex-shrink: 0; font-size: 10px; font-weight: 700; border: 1px solid; border-radius: 4px; padding: 1px 4px; }
    .heading-outline .ho-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-strong); }
    .heading-outline .ho-sel { flex-shrink: 0; font-size: 10.5px; padding: 2px 4px; border: 1px solid var(--border-soft); border-radius: 5px; background: #fff; color: var(--text-strong); cursor: pointer; }
    .heading-outline .ho-sel:hover { border-color: var(--brand); }
    /* Transient highlight on a heading picked from the outline panel. */
    .outline-flash { outline: 2px solid #f59e0b; outline-offset: 2px; background: #fffbeb; border-radius: 3px; }
    .cr-tab-icon {
      font-size: 16px; line-height: 1;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .cr-tab-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .cr-tab-num {
      font-size: 11px; font-weight: 700;
      color: var(--text-strong);
    }
    .cr-tab-label {
      font-size: 10.5px; color: var(--text-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Reference list — searchable text-row layout. Chips don't scale to
       75+ refs; an input + scrollable text list mirrors how citation
       managers (Zotero, Mendeley) let you find a ref by author or year. */
    .cr-ref-search-wrap {
      display: flex; align-items: center; gap: 8px;
      width: 100%;
      margin-bottom: 4px;
    }
    .cr-ref-search {
      flex: 1;
      padding: 4px 8px;
      font-size: 11.5px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg-page);
    }
    .cr-ref-search:focus {
      outline: none;
      border-color: var(--brand);
      background: #fff;
    }
    .cr-ref-count {
      font-size: 10.5px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .cr-ref-list {
      display: flex; flex-direction: column;
      gap: 2px;
      width: 100%;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      background: #fff;
    }
    .cr-ref-row {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 5px 8px;
      font-size: 11px;
      line-height: 1.4;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
      color: var(--text);
      transition: background .1s;
    }
    .cr-ref-row:last-child { border-bottom: 0; }
    .cr-ref-row:hover { background: var(--brand-soft); }
    .cr-ref-row:hover .cr-ref-row-num { color: var(--brand); }
    .cr-ref-row-num {
      font-weight: 700;
      color: var(--text-strong);
      flex-shrink: 0;
      min-width: 26px;
      text-align: right;
    }
    .cr-ref-row-text {
      flex: 1;
      color: var(--text-muted);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .cr-ref-empty {
      padding: 8px;
      text-align: center;
    }

    /* Broken cross-reference links — visual flag for anchors whose target
       isn't in the article yet. Surfaces silent dead-links so the editor
       can fix them before publishing. */
    .article-ref-broken {
      text-decoration: underline wavy #c2410c;
      text-decoration-skip-ink: none;
      cursor: help;
    }
    .article-ref-broken::after {
      content: '⚠';
      font-size: 0.78em;
      vertical-align: super;
      margin-left: 2px;
      color: #c2410c;
    }

    /* Live hint next to manual number input — "✓ var" / "⚠ yok". */
    .cr-manual-hint {
      font-size: 10px; font-weight: 700;
      min-width: 36px;
      color: var(--text-faint);
      white-space: nowrap;
    }
    .cr-manual-hint.is-ok   { color: #16a34a; }
    .cr-manual-hint.is-warn { color: #c2410c; }

    /* Reference list rendering inside the contenteditable Tam Metin editor.
       Word-export articles ship references as MsoListParagraph <p>'s with
       text-indent:-18pt; our runtime normaliser collapses them into
       <ol class="article-references-ol">, but the editor still inherits
       Word's inline indent on the wrapper and the native <ol> ::marker
       would clip. CSS counters keep the number inside the <li> box. */
    #ft-visual .article-references-ol,
    #aip-ft-visual .article-references-ol {
      list-style: none;
      padding-left: 0;
      margin: 1rem 0 0;
      counter-reset: ref-num;
    }
    #ft-visual .article-references-ol > li,
    #aip-ft-visual .article-references-ol > li {
      position: relative;
      padding-left: 2.9rem;
      margin-bottom: 0.7rem;
      line-height: 1.55;
      counter-increment: ref-num;
      text-indent: 0;        /* override any inherited Word text-indent */
    }
    #ft-visual .article-references-ol > li::before,
    #aip-ft-visual .article-references-ol > li::before {
      content: counter(ref-num) ".";
      position: absolute;
      left: 0;
      top: 0;
      width: 2.4rem;
      text-align: left;
      font-weight: 600;
      color: var(--text-strong, #1f2937);
    }
    /* Also kill the leftover Word text-indent on the wrapping div so the
       references heading and the OL line up with the rest of the editor. */
    #ft-visual .article-references,
    #aip-ft-visual .article-references {
      text-indent: 0;
    }
    /* Backlinks (↩, ↩¹ ↩² …) appended to each <li> by _autoLinkInEditor
       Pass 3 so the editor preview matches the public-site behaviour. */
    #ft-visual .article-ref-backlinks,
    #aip-ft-visual .article-ref-backlinks {
      margin-left: 6px;
      white-space: nowrap;
    }
    #ft-visual .article-ref-backlink,
    #aip-ft-visual .article-ref-backlink {
      color: #0f766e;
      text-decoration: none;
      font-size: 0.92em;
      margin: 0 1px;
      padding: 0 2px;
      border-radius: 2px;
    }
    #ft-visual .article-ref-backlink:hover,
    #aip-ft-visual .article-ref-backlink:hover {
      background: rgba(15, 118, 110, 0.12);
      text-decoration: underline;
    }

    /* "Yeni Figür" / "Yeni Tablo" / "Yeni Kaynak" buttons — Galenos-style
       inline action that adds a new block + cross-ref in one go. */
    .cr-upload-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      font-size: 11px; font-weight: 600;
      color: var(--brand);
      background: var(--brand-soft);
      border: 1px solid color-mix(in oklab, var(--brand) 35%, transparent);
      border-radius: 5px;
      cursor: pointer;
      transition: background .12s, color .12s;
      white-space: nowrap;
    }
    .cr-upload-btn:hover {
      background: var(--brand);
      color: #fff;
    }

    /* "+ Yeni Kaynak" inline form — appears below the ref chip grid when
       toggled. */
    .cr-newref-form {
      display: flex; flex-direction: column; gap: 4px;
      width: 100%;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-soft);
    }
    .cr-newref-text {
      width: 100%;
      padding: 6px 8px;
      font-size: 11.5px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fff;
      resize: vertical;
      min-height: 50px;
      font-family: inherit;
    }
    .cr-newref-actions {
      display: flex; justify-content: flex-end; gap: 6px;
    }
    .cr-newref-actions button {
      padding: 3px 10px;
      font-size: 11px; font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-strong);
    }
    .cr-newref-actions .cr-newref-go {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    .cr-newref-actions .cr-newref-go:hover { background: var(--brand-strong, var(--brand)); }

    /* Figure wizard thumbnail + hover overlay */
    .wiz-thumb {
      position: relative;
      cursor: pointer;
    }
    .wiz-thumb-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 118, 110, 0.92);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.18s ease;
      font-weight: 600;
      font-size: 12px;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    .wiz-thumb:hover .wiz-thumb-overlay,
    .wiz-thumb:focus-within .wiz-thumb-overlay,
    .wiz-thumb-overlay:hover,
    .wiz-thumb-overlay:focus {
      opacity: 1;
    }
    /* Reveal the delete button when the parent card is hovered/focused */
    .card-flat:hover .wiz-thumb-delete,
    .card-flat:focus-within .wiz-thumb-delete,
    .wiz-thumb-delete:focus {
      opacity: 1 !important;
    }
  </style>
